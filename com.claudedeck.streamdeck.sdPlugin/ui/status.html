	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<sdpi-item label="Project folder">
		<sdpi-textfield setting="project" placeholder="F:\Code\MyProject (optional)"></sdpi-textfield>

	<sdpi-item>
		<details>
			<summary>Help</summary>

	</sdpi-item>
