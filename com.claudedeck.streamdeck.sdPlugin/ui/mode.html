<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<!-- bypassPermissions is deliberately not offered: one tap would switch off all further prompts of the session. -->
	<sdpi-item label="Switch to">
		<sdpi-select setting="mode" default="acceptEdits">
			<option value="acceptEdits">Accept edits</option>
			<option value="plan">Plan mode</option>
			<option value="default">Default (ask)</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item>
		<details>
			<summary>Help</summary>
			<p>When Claude Code asks for permission, this key allows the request and switches that session to the chosen mode.</p>
		</details>
	</sdpi-item>
</body>
</html>
